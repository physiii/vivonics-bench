[Service]
# Publish the IR-capable USB camera at its highest native 30 fps mode.  The
# previous rtsp.sh defaults capped the operator view at 1280x720 and 3 Mbit/s,
# which visibly macroblocked this high-noise, low-light optical scene.
Environment=USB_CAMERA_SIZE=1920x1080
Environment=USB_CAMERA_FPS=30
ExecStart=
ExecStart=/usr/bin/ffmpeg -hide_banner -loglevel warning -f v4l2 -framerate 30 -video_size 1920x1080 -input_format mjpeg -i /dev/v4l/by-id/usb-H264_USB_Camera_H264_USB_Camera_2020032801-video-index0 -vf format=yuv420p -c:v h264_v4l2m2m -b:v 20000k -g 30 -bf 0 -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:8554/cam

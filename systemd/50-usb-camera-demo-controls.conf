[Service]
# Normal operator-view settings for the IR-capable USB camera on the current
# camera bench.  The defaults (automatic exposure with gain 0) render the
# enclosed optical scene almost black.  These controls affect only the USB
# WebRTC/RTSP preview; direct IMX477 measurement capture is unchanged.
ExecStartPost=/usr/bin/v4l2-ctl --device=/dev/v4l/by-id/usb-H264_USB_Camera_H264_USB_Camera_2020032801-video-index0 --set-ctrl=auto_exposure=1,exposure_time_absolute=300,gain=50,brightness=0,gamma=100,power_line_frequency=2

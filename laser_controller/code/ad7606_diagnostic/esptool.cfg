[esptool]
# The board uses the crossed CP2102N DTR/RTS auto-reset circuit documented by
# the laser-controller firmware. Atomic line changes avoid asserting EN and
# GPIO0 in an unintended intermediate state.
custom_reset_sequence = U0,0|U0,1|W0.15|U1,1|W0.20|U0,0|W0.05
custom_hard_reset_sequence = U0,0|U0,1|W0.15|U0,0|W0.05

[esptool]
# The CP2102N DTR/RTS stage on this board uses the same crossed auto-reset
# topology as the Vivonics access-controller.  Atomic line updates are required
# to avoid the Linux serial driver briefly asserting both control signals.
custom_reset_sequence = U0,0|U0,1|W0.15|U1,1|W0.20|U0,0|W0.05
custom_hard_reset_sequence = U0,0|U0,1|W0.15|U0,0|W0.05
